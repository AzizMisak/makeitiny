# Tanımsız Host başlığı veya dış adreslerden gelen istekleri engelle
server {
    listen 80 default_server;
    server_name _;

    return 444;
}

# Geliştirme ortamı: yalnızca localhost ve 127.0.0.1 üzerinden gelen isteklere izin ver
server {
    listen 80;
    server_name localhost 127.0.0.1;

    # 1. Yönetim API Servisi (/api/* -> api:8080/*)
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Kısa Link Yönlendirme Servisi (/r/* -> router:8081/*)
    location /r/ {
        proxy_pass http://router:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Web Kullanıcı Arayüzü (Diğer tüm istekler -> frontend:3000)
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

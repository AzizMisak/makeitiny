services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: makeitiny
      POSTGRES_PASSWORD: makeitiny
      POSTGRES_DB: makeitiny
    volumes:
      - ./Backend/db/data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: ./Backend/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://makeitiny:makeitiny@postgres:5432/makeitiny?sslmode=disable
      REDIS_URL: redis://redis:6379
      PORT: "8080"
    depends_on:
      - postgres
      - redis

  router:
    build: ./Backend/router
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://makeitiny:makeitiny@postgres:5432/makeitiny?sslmode=disable
      REDIS_URL: redis://redis:6379
      PORT: "8081"
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - router

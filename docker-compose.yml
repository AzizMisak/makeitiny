services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-makeitiny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-makeitiny}
      POSTGRES_DB: ${POSTGRES_DB:-makeitiny}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./Backend/db/data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: ./Backend/api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-makeitiny}:${POSTGRES_PASSWORD:-makeitiny}@postgres:5432/${POSTGRES_DB:-makeitiny}?sslmode=disable
      REDIS_URL: redis://redis:6379
      PORT: "8080"
    depends_on:
      - postgres
      - redis

  router:
    build: ./Backend/router
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-makeitiny}:${POSTGRES_PASSWORD:-makeitiny}@postgres:5432/${POSTGRES_DB:-makeitiny}?sslmode=disable
      REDIS_URL: redis://redis:6379
      PORT: "8081"
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./Frontend
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - router
      - frontend

  swagger:
    image: swaggerapi/swagger-ui:latest
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      URLS: "[{ url: 'openapi/api.yaml', name: 'API Service' }, { url: 'openapi/router.yaml', name: 'Router Service' }]"
      URLS_PRIMARY_NAME: "API Service"
    volumes:
      - ./openapi:/usr/share/nginx/html/openapi:ro

          minLength: 3
          maxLength: 32
          example: yeni-kampanya
        title:
          type: string
          example: Yeni Başlık
        password:
          type: string
          description: Boş string gönderilirse parola kaldırılır, dolu gönderilirse güncellenir.
          example: yeniSifre123
        waitEnabled:
          type: boolean
          example: true
        waitSeconds:
          type: integer
          format: int32
          example: 10
        isActive:
          type: boolean
          example: true
        expiresAt:
          type: string
          description: Boş string gönderilirse süre sınırı kaldırılır.
          example: "2027-01-01"
        maxClicks:
          type: integer
          format: int64
          description: 0 veya negatif gönderilirse tıklama sınırı kaldırılır.
          example: 1000
        adEnabled:
          type: boolean
          example: false

    AliasCheckResult:
      type: object

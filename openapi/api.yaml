components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Giriş veya kayıt sonrası alınan JWT token (Authorization: Bearer <token>)"

  parameters:
    ExportFormat:
      name: format
      in: query
      required: false
      schema:
        type: string
        enum: [csv, json]
        default: csv

  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: invalid_request
        message:
          type: string
          example: Geçersiz istek parametreleri.
        fields:
          type: object
          additionalProperties:
            type: string
          example:
            email: Geçerli bir e-posta adresi giriniz.

    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: İşlem başarıyla tamamlandı.

    PlanItem:
      type: object
      required:
        - id
        - slug
        - name
        - priceMonthly
        - maxLinks
        - allowCustomAlias
        - allowPassword
        - allowQr
        - allowAds
        - analyticsDays
      properties:
        id:
          type: integer
          format: int32
          example: 1
        slug:
          type: string
          example: free
        name:
          type: string
          example: Ücretsiz Paket
        priceMonthly:
          type: number
          format: double
          example: 0
        maxLinks:
          type: integer
          format: int32
          example: 50
        allowCustomAlias:
          type: boolean
          example: false
        allowPassword:
          type: boolean
          example: true
        allowQr:
          type: boolean
          example: false
        allowAds:
          type: boolean
          example: false
        analyticsDays:
          type: integer
          format: int32
          example: 7

    User:
      type: object
      required:
        - id
        - name
        - email
        - isActive
        - banReason
        - roles
        - plan
        - linkCount
        - createdAt
      properties:
        id:
          type: string
          example: "aB3xK9mZpQ2vL7nR"
        name:
          type: string
          example: aziz
        email:
          type: string
          format: email
          example: aziz@makeitiny.com
        isActive:
          type: boolean
          example: true
        banReason:
          type: string
          example: ""
        bannedUntil:
          type: string
          example: "2026-12-01T23:59:59Z"
        roles:
          type: array
          items:
            type: string
          example: ["user"]
        plan:
          $ref: '#/components/schemas/PlanItem'
        planExpiresAt:
          type: string
          example: "2027-01-01"
        linkCount:
          type: integer
          format: int64
          example: 12
        createdAt:
          type: string
          example: "2026-11-14"

    ChangePlanRequest:
      type: object
      required:
        - planId
      properties:
        planId:
          type: integer
          format: int32
          example: 2

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        name:
          type: string
          example: aziz
        email:
          type: string
          format: email
          example: aziz@makeitiny.com
        password:
          type: string
          minLength: 4
          example: GucluSifre123

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: aziz@makeitiny.com
        password:
          type: string
          example: GucluSifre123

    ResetPasswordRequest:
      type: object
      required:
        - email
        - newPassword
      properties:
        email:
          type: string
          format: email
          example: aziz@makeitiny.com
        currentPassword:
          type: string
          description: Kendi şifresini değiştiren kullanıcı için mevcut parola zorunludur (admin/owner başkasının şifresini sıfırlarken gerekmez).
          example: EskiSifre123
        newPassword:
          type: string
          minLength: 4
          example: YeniGucluSifre123

    UpdateCurrentUserRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 40
          description: Baştaki ve sondaki boşluklar kırpılır.
          example: Aziz

    AuthResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'

    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
          example: optional_refresh_token_if_not_cookie

    LinkItem:
      type: object
      required:
        - id
        - alias
        - target
        - clicks
        - locked
        - waitEnabled
        - waitSeconds
        - title
        - isActive
        - adEnabled
        - securityStatus
        - hasQr
        - qrUrl
        - isAnonymous
        - createdAt
      properties:
        id:
          type: string
          example: "k9Xm2pQ7vR4nL8wZ"
        alias:
          type: string
          example: kampanya-yaz
        target:
          type: string
          format: uri
          example: https://magaza.example.com/kampanyalar/yaz-indirimi
        title:
          type: string
          example: Yaz Kampanyası
        clicks:
          type: integer
          format: int64
          example: 1284
        locked:
          type: boolean
          example: false
        waitEnabled:
          type: boolean
          example: false
        waitSeconds:
          type: integer
          format: int32
          example: 0
        isActive:
          type: boolean
          example: true
        expiresAt:
          type: string
          example: "2027-01-01"
        maxClicks:
          type: integer
          format: int64
          example: 5000
        adEnabled:
          type: boolean
          example: false
        securityStatus:
          type: string
          example: "unchecked"
        hasQr:
          type: boolean
          example: true
        qrUrl:
          type: string
          example: "/api/links/k9Xm2pQ7vR4nL8wZ/qr"
        isAnonymous:
          type: boolean
          example: false
        createdAt:
          type: string
          example: "2026-10-02"
        planGraceUntil:
          type: string
          description: Doluysa link paket düşürüldüğü için askıdadır ve bu tarihte kalıcı olarak silinir.
          example: "2027-01-25"

    CreateAnonymousLinkRequest:
      type: object
      required:
        - target
      properties:
        target:
          type: string
          format: uri
          example: https://example.com/gecici
        password:
          type: string
          example: gizli123
        waitEnabled:
          type: boolean
          example: false
        waitSeconds:
          type: integer
          format: int32
          example: 5
        ttlHours:
          type: integer
          format: int32
          minimum: 1
          maximum: 48
          example: 48

    AnonymousLinkResponse:
      type: object
      required:
        - id
        - alias
        - shortUrl
        - target
        - locked
        - waitEnabled
        - waitSeconds
        - expiresAt
        - hasQr
        - qrUrl
      properties:
        id:
          type: string
          example: "k9Xm2pQ7vR4nL8wZ"
        alias:
          type: string
          example: "x7Kp2q"
        shortUrl:
          type: string
          example: "http://localhost/r/x7Kp2q"
        target:
          type: string
          example: "https://example.com/gecici"
        locked:
          type: boolean
          example: false
        waitEnabled:
          type: boolean
          example: false
        waitSeconds:
          type: integer
          format: int32
          example: 0
        expiresAt:
          type: string
          example: "2026-11-27T17:30:00Z"
        hasQr:
          type: boolean
          example: true
        qrUrl:
          type: string
          example: "/api/links/k9Xm2pQ7vR4nL8wZ/qr"

    AdminLinkItem:
      allOf:
        - $ref: '#/components/schemas/LinkItem'
        - type: object
          required:
            - userId
            - userEmail
            - userName
          properties:
            userId:
              type: string
              example: "1"
            userEmail:
              type: string
              example: "admin@admin.com"
            userName:
              type: string
              example: "admin"

    LinkLogItem:
      type: object
      required:
        - id
        - linkId
        - ipAddress
        - userAgent
        - deviceType
        - browser
        - os
        - referer
        - acceptLanguage
        - countryCode
        - clickedAt
      properties:
        id:
          type: string
          example: "10"
        linkId:
          type: string
          example: "k9Xm2pQ7vR4nL8wZ"
        ipAddress:
          type: string
          example: "127.0.0.1"
        userAgent:
          type: string
          example: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)..."
        deviceType:
          type: string
          example: "Masaüstü"
        browser:
          type: string
          example: "Chrome"
        os:
          type: string
          example: "Windows"
        referer:
          type: string
          example: "Doğrudan"
        acceptLanguage:
          type: string
          example: "tr-TR"
        countryCode:
          type: string
          example: "TR"
        clickedAt:
          type: string
          format: date-time
          description: UTC, RFC 3339 biçiminde. Arayüz yerel saate çevirir.
          example: "2026-11-12T08:45:00Z"

    PaginatedLinksResponse:
      type: object
      required:
        - items
        - page
        - limit
        - total
        - totalPages
        - totalClicks
        - lockedCount
        - topLinks
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LinkItem'
        page:
          type: integer
          format: int32
          example: 1
        limit:
          type: integer
          format: int32
          example: 10
        total:
          type: integer
          format: int64
          example: 42
        totalPages:
          type: integer
          format: int32
          example: 5
        totalClicks:
          type: integer
          format: int64
          example: 1284
        lockedCount:
          type: integer
          format: int64
          example: 3
        topLinks:
          type: array
          items:
            $ref: '#/components/schemas/LinkItem'

    PaginatedLogsResponse:
      type: object
      required:
        - items
        - page
        - limit
        - total
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LinkLogItem'
        page:
          type: integer
          format: int32
          example: 1
        limit:
          type: integer
          format: int32
          example: 20
        total:
          type: integer
          format: int64
          example: 150
        totalPages:
          type: integer
          format: int32
          example: 8

    CreateLinkRequest:
      type: object
      required:
        - target
      properties:
        target:
          type: string
          format: uri
          example: https://magaza.example.com/kampanyalar/yaz-indirimi
        alias:
          type: string
          minLength: 3
          maxLength: 32
          example: kampanya-yaz
        title:
          type: string
          example: Yaz Kampanyası
        password:
          type: string
          example: gizli123
        waitEnabled:
          type: boolean
          example: false
        waitSeconds:
          type: integer
          format: int32
          example: 5
        expiresAt:
          type: string
          description: ISO 8601 veya YYYY-MM-DD tarih formatı
          example: "2027-01-01"
        maxClicks:
          type: integer
          format: int64
          example: 1000
        adEnabled:
          type: boolean
          example: false

    UpdateLinkRequest:
      type: object
      properties:
        target:
          type: string
          format: uri
          example: https://magaza.example.com/yeni-hedef
        alias:

openapi: 3.0.3
info:
  title: MakeItTiny API
  version: 0.2.0
  description: MakeItTiny kullanıcı yönetimi, kimlik doğrulama, kısa link CRUD, üyelik paketleri ve RBAC yönetim servisi.
servers:
  - url: http://localhost/api
    description: API (Nginx Reverse Proxy)
  - url: http://localhost:8080
    description: API (Doğrudan Port - Geliştirme)
tags:
  - name: Health
  - name: Auth
  - name: Plans
  - name: Links
  - name: Admin
paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Sağlık kontrolü
      responses:
        '200':
          description: Servis ayakta
          content:
            text/plain:
              schema:
                type: string
                example: Healthy

  /plans:
    get:
      operationId: listPlans
      tags: [Plans]
      summary: Sistemdeki tüm üyelik paketlerini ve limitlerini listele
      responses:
        '200':
          description: Üyelik paketleri listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanItem'

  /auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Yeni kullanıcı kaydı oluştur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Kayıt başarılı ve oturum açıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Geçersiz istek verisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: E-posta adresi zaten kullanımda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Kullanıcı girişi yap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Giriş başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Geçersiz istek verisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: E-posta veya parola hatalı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Hesap askıya alınmış
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Oturumu sonlandır
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Çıkış başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/resetpass:
    post:
      operationId: resetPassword
      tags: [Auth]
      summary: Kullanıcı şifresini değiştir / sıfırla
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Şifre başarıyla güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Geçersiz istek verisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Kullanıcı bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/user:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Oturumdaki kullanıcı bilgisini, rollerini, paketini ve kullanım kotasını getir
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Kullanıcı bilgileri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Hesap askıya alınmış
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      operationId: deleteUser
      tags: [Auth]
      summary: Oturumdaki kullanıcının hesabını ve tüm linklerini sil
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Hesap başarıyla silindi
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /links:
    post:
      operationId: createLink
      tags: [Links]
      summary: Yeni kısa link oluştur
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
      responses:
        '201':
          description: Kısa link oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkItem'
        '400':
          description: Geçersiz URL veya parametre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Paket kota veya özellik sınırı aşıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Seçilen takma ad (alias) zaten kullanımda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      operationId: listLinks
      tags: [Links]
      summary: Oturumdaki kullanıcıya ait kısaltılmış linkleri sayfalı olarak listele
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Kullanıcının sayfalı link listesi ve özet istatistikleri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLinksResponse'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /links/check-alias/{alias}:
    get:
      operationId: checkAlias
      tags: [Links]
      summary: Özel takma ad (custom alias) müsait mi kontrol et
      security:
        - bearerAuth: []
      parameters:
        - name: alias
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 32
      responses:
        '200':
          description: Kontrol sonucu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AliasCheckResult'
        '400':
          description: Geçersiz alias formatı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /links/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getLink
      tags: [Links]
      summary: Kullanıcıya ait tek bir linkin detayını getir
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Link detayı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkItem'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Link bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      operationId: updateLink
      tags: [Links]
      summary: Mevcut bir linki düzenle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLinkRequest'
      responses:
        '200':
          description: Güncellenmiş link bilgisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkItem'
        '400':
          description: Geçersiz istek verisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Paket özellik sınırı aşıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Link bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Yeni takma ad zaten kullanımda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      operationId: deleteLink
      tags: [Links]
      summary: Kullanıcıya ait bir linki sil
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Link başarıyla silindi
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Link bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /links/logs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listLinkLogs
      tags: [Links]
      summary: Kullanıcıya ait bir linkin tıklama loglarını sayfalı olarak listele
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Link tıklama logları sayfalı listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLogsResponse'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Link bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [Admin]
      summary: Sistem genelindeki kullanıcı, link ve tıklama istatistiklerini getir (admin/owner)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Platform istatistikleri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatsResponse'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Yetersiz rol yetkisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /admin/links:
    get:
      operationId: adminListLinks
      tags: [Admin]
      summary: Sistemdeki tüm linkleri filtreli ve sayfalı olarak listele (admin/owner)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, active, inactive, blocked]
      responses:
        '200':
          description: Tüm linklerin sayfalı listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPaginatedLinksResponse'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Yetersiz rol yetkisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /admin/links/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: adminUpdateLink
      tags: [Admin]
      summary: Herhangi bir linke müdahale et / düzenle (admin/owner)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateLinkRequest'
      responses:
        '200':
          description: Güncellenmiş link bilgisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkItem'
        '400':
          description: Geçersiz istek verisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Yetersiz rol yetkisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Link bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      operationId: adminDeleteLink
      tags: [Admin]
      summary: Herhangi bir linki sistemden sil (admin/owner)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Link silindi
        '403':
          description: Yetersiz rol yetkisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Link bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /admin/link-logs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: adminListLinkLogs
      tags: [Admin]
      summary: Herhangi bir linkin tüm tıklama loglarını sayfalı getir (admin/owner)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Linkin tıklama logları
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLogsResponse'
        '403':
          description: Yetersiz rol yetkisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Link bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [Admin]
      summary: Sistemdeki tüm kullanıcıları filtreli ve sayfalı olarak listele (admin/owner)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Kullanıcıların sayfalı listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPaginatedUsersResponse'
        '403':
          description: Yetersiz rol yetkisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: adminUpdateUser
      tags: [Admin]
      summary: Kullanıcının aktiflik durumunu (ban) veya paketini güncelle (admin/owner)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequest'
      responses:
        '200':
          description: Güncellenmiş kullanıcı bilgisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Geçersiz istek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Yetersiz yetki
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Kullanıcı bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /admin/user-role/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: adminUpdateUserRole
      tags: [Admin]
      summary: Kullanıcının rolünü değiştir (yalnızca owner)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateRoleRequest'
      responses:
        '200':
          description: Güncellenmiş kullanıcı bilgisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Geçersiz rol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Yalnızca owner bu işlemi yapabilir
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Kullanıcı bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /admin/plans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
    patch:
      operationId: adminUpdatePlan
      tags: [Admin]
      summary: Üyelik paketi limit ve özelliklerini güncelle (yalnızca owner)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdatePlanRequest'
      responses:
        '200':
          description: Güncellenmiş paket bilgisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanItem'
        '400':
          description: Geçersiz istek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Yalnızca owner bu işlemi yapabilir
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Paket bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Giriş veya kayıt sonrası alınan JWT token (Authorization: Bearer <token>)"

  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: invalid_request
        message:
          type: string
          example: Geçersiz istek parametreleri.
        fields:
          type: object
          additionalProperties:
            type: string
          example:
            email: Geçerli bir e-posta adresi giriniz.

    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: İşlem başarıyla tamamlandı.

    PlanItem:
      type: object
      required:
        - id
        - slug
        - name
        - priceMonthly
        - maxLinks
        - allowCustomAlias
        - allowPassword
        - allowQr
        - allowAds
        - analyticsDays
      properties:
        id:
          type: integer
          format: int32
          example: 1
        slug:
          type: string
          example: free
        name:
          type: string
          example: Ücretsiz Paket
        priceMonthly:
          type: number
          format: double
          example: 0
        maxLinks:
          type: integer
          format: int32
          example: 50
        allowCustomAlias:
          type: boolean
          example: false
        allowPassword:
          type: boolean
          example: true
        allowQr:
          type: boolean
          example: false
        allowAds:
          type: boolean
          example: false
        analyticsDays:
          type: integer
          format: int32
          example: 7

    User:
      type: object
      required:
        - id
        - name
        - email
        - isActive
        - roles
        - plan
        - linkCount
        - createdAt
      properties:
        id:
          type: string
          example: "1"
        name:
          type: string
          example: aziz
        email:
          type: string
          format: email
          example: aziz@makeitiny.com
        isActive:
          type: boolean
          example: true
        roles:
          type: array
          items:
            type: string
          example: ["user"]
        plan:
          $ref: '#/components/schemas/PlanItem'
        planExpiresAt:
          type: string
          example: "2027-01-01"
        linkCount:
          type: integer
          format: int64
          example: 12
        createdAt:
          type: string
          example: "2026-11-14"

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        name:
          type: string
          example: aziz
        email:
          type: string
          format: email
          example: aziz@makeitiny.com
        password:
          type: string
          minLength: 4
          example: GucluSifre123

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: aziz@makeitiny.com
        password:
          type: string
          example: GucluSifre123

    ResetPasswordRequest:
      type: object
      required:
        - email
        - newPassword
      properties:
        email:
          type: string
          format: email
          example: aziz@makeitiny.com
        newPassword:
          type: string

openapi: 3.0.3
info:
  title: MakeItTiny API
  version: 0.2.0
  description: MakeItTiny kullanıcı yönetimi, kimlik doğrulama, kısa link CRUD, üyelik paketleri ve RBAC yönetim servisi.
servers:
  - url: http://localhost/api
    description: API (Nginx Reverse Proxy)
  - url: http://localhost:8080
    description: API (Doğrudan Port - Geliştirme)
tags:
  - name: Health
  - name: Auth
  - name: Plans
  - name: Links
  - name: Admin
paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Sağlık kontrolü
      responses:
        '200':
          description: Servis ayakta
          content:
            text/plain:
              schema:
                type: string
                example: Healthy

  /plans:
    get:
      operationId: listPlans
      tags: [Plans]
      summary: Sistemdeki tüm üyelik paketlerini ve limitlerini listele
      responses:
        '200':
          description: Üyelik paketleri listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanItem'

  /auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Yeni kullanıcı kaydı oluştur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Kayıt başarılı ve oturum açıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Geçersiz istek verisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: E-posta adresi zaten kullanımda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Kullanıcı girişi yap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Giriş başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Geçersiz istek verisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: E-posta veya parola hatalı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Hesap askıya alınmış
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Oturumu sonlandır
      description: >
        Yetki istemez; süresi dolmuş erişim anahtarıyla da çıkış yapılabilsin diye. Gönderilen Bearer token (varsa)
        kara listeye alınır ve HttpOnly refresh çerezi iptal edilir.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Çıkış başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: Refresh token kullanarak yeni kısa ömürlü Access JWT al (token rotasyonu)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token yenilendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Geçersiz, süresi dolmuş veya iptal edilmiş refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Hesap askıya alınmış
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/resetpass:
    post:
      operationId: resetPassword
      tags: [Auth]
      summary: Kullanıcı şifresini değiştir / sıfırla
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Şifre başarıyla güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Geçersiz istek verisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Yetersiz yetki
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Kullanıcı bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/user:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Oturumdaki kullanıcı bilgisini, rollerini, paketini ve kullanım kotasını getir
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Kullanıcı bilgileri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Hesap askıya alınmış
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      operationId: updateCurrentUser
      tags: [Auth]
      summary: Oturumdaki kullanıcının adını değiştir
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserRequest'
      responses:
        '200':
          description: Güncellenmiş kullanıcı bilgileri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Geçersiz ad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      operationId: deleteUser
      tags: [Auth]
      summary: Oturumdaki kullanıcının hesabını ve tüm linklerini sil
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Hesap başarıyla silindi
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Owner hesabı silinemez veya hesap askıya alınmış
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/user/plan:
    put:
      operationId: changeCurrentUserPlan
      tags: [Auth]
      summary: Oturumdaki standart kullanıcının paketini değiştir
      description: |
        Ödeme entegrasyonu olmadığından paket süresiz atanır. Yeni paketin link sınırını aşan en eski
        linkler askıya alınır (planGraceUntil); yönlendirmeye devam eder ve bu tarihte kalıcı olarak silinir.
        Sınırı yeterli bir pakete geri dönülürse askı kalkar. Yönetici ve sahip hesapları paket seçemez.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePlanRequest'
      responses:
        '200':
          description: Güncellenmiş kullanıcı bilgileri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Paket bulunamadı (plan_not_found) veya hesap pakete tabi değil (plan_not_applicable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Hesap askıya alınmış
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /links:
    post:
      operationId: createLink
      tags: [Links]
      summary: Yeni kısa link oluştur
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
      responses:
        '201':
          description: Kısa link oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkItem'
        '400':
          description: Geçersiz URL veya parametre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Paket kota veya özellik sınırı aşıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Seçilen takma ad (alias) zaten kullanımda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      operationId: listLinks
      tags: [Links]
      summary: Oturumdaki kullanıcıya ait kısaltılmış linkleri sayfalı olarak listele
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Kullanıcının sayfalı link listesi ve özet istatistikleri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLinksResponse'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /links/anonymous:
    post:
      operationId: createAnonymousLink
      tags: [Links]
      summary: Üyeliksiz geçici kısa link oluştur (maksimum 2 gün, IP başına günde 1 adet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnonymousLinkRequest'
      responses:
        '201':
          description: Anonim kısa link oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousLinkResponse'
        '400':
          description: Geçersiz URL veya parametre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Günlük anonim link oluşturma limiti aşıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /links/check-alias/{alias}:
    get:
      operationId: checkAlias
      tags: [Links]
      summary: Özel takma ad (custom alias) müsait mi kontrol et
      security:
        - bearerAuth: []
      parameters:
        - name: alias
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 32
      responses:
        '200':
          description: Kontrol sonucu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AliasCheckResult'
        '400':
          description: Geçersiz alias formatı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /links/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getLink
      tags: [Links]
      summary: Kullanıcıya ait tek bir linkin detayını getir
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Link detayı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkItem'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Link bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      operationId: updateLink
      tags: [Links]
      summary: Mevcut bir linki düzenle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLinkRequest'
      responses:
        '200':
          description: Güncellenmiş link bilgisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkItem'
        '400':
          description: Geçersiz istek verisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Paket özellik sınırı aşıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Link bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Yeni takma ad zaten kullanımda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      operationId: deleteLink
      tags: [Links]
      summary: Kullanıcıya ait bir linki sil
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Link başarıyla silindi
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Link bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /links/{id}/qr:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getLinkQr
      tags: [Links]
      summary: Linke ait QR kod PNG görselini getir (?download=1 ile indirme)
      parameters:
        - name: download
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: QR kod PNG görseli
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: QR kod veya link bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: generateLinkQr
      tags: [Links]
      summary: Link için QR kod görseli oluştur veya yeniden üret
      security:
        - bearerAuth: []
      responses:
        '200':
          description: QR kod oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkItem'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Paket QR özelliğini desteklemiyor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Link bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      operationId: deleteLinkQr
      tags: [Links]
      summary: Linke ait QR kod görselini sil
      security:
        - bearerAuth: []
      responses:
        '204':
          description: QR kod silindi
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Link bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /links/export:
    get:
      operationId: exportLinks
      tags: [Links]
      summary: Kullanıcının bütün linklerini CSV ya da JSON olarak indir
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExportFormat'
      responses:
        '200':
          description: >
            Dosya ek olarak döner (Content-Disposition: attachment). CSV, Excel'in Türkçe karakterleri
            doğru açması için UTF-8 BOM ile başlar ve virgülle ayrılır.
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkItem'
        '400':
          description: Geçersiz biçim (invalid_format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /links/logs/{id}/export:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: exportLinkLogs
      tags: [Links]
      summary: Bir linkin ziyaret kayıtlarını CSV ya da JSON olarak indir
      description: Paketin analiz süresi sınırı burada da geçerlidir; yönetici ve sahip tüm geçmişi alır. En fazla 100.000 kayıt.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExportFormat'
      responses:
        '200':
          description: 'Dosya ek olarak döner (Content-Disposition: attachment).'
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkLogItem'
        '400':
          description: Geçersiz biçim (invalid_format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Link bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /links/logs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listLinkLogs
      tags: [Links]
      summary: Kullanıcıya ait bir linkin tıklama loglarını sayfalı olarak listele
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Link tıklama logları sayfalı listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLogsResponse'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Link bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [Admin]
      summary: Sistem genelindeki kullanıcı, link ve tıklama istatistiklerini getir (admin/owner)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Platform istatistikleri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatsResponse'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Yetersiz rol yetkisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /admin/links:
    get:
      operationId: adminListLinks
      tags: [Admin]
      summary: Sistemdeki tüm linkleri filtreli ve sayfalı olarak listele (admin/owner)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, active, inactive, blocked, anonymous]
      responses:
        '200':
          description: Tüm linklerin sayfalı listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPaginatedLinksResponse'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Yetersiz rol yetkisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /admin/links/export:
    get:
      operationId: adminExportLinks
      tags: [Admin]
      summary: Filtreye uyan tüm linkleri CSV ya da JSON olarak indir (admin/owner)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExportFormat'
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, active, inactive, blocked, anonymous]
      responses:
        '200':
          description: 'Dosya ek olarak döner (Content-Disposition: attachment).'
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminLinkItem'
        '400':
          description: Geçersiz biçim veya durum filtresi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Yetkisiz erişim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Yetersiz rol yetkisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /admin/links/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:

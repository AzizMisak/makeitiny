        activeUsers:
          type: integer
          format: int64
          example: 24
        totalLinks:
          type: integer
          format: int64
          example: 340
        activeLinks:
          type: integer
          format: int64
          example: 332
        blockedLinks:
          type: integer
          format: int64
          example: 3
        totalClicks:
          type: integer
          format: int64
          example: 15820

    AdminPaginatedLinksResponse:
      type: object
      required:
        - items
        - page
        - limit
        - total
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminLinkItem'
        page:
          type: integer
          format: int32
          example: 1
        limit:
          type: integer
          format: int32
          example: 20
        total:

openapi: 3.0.3
info:
  title: MakeItTiny Router
  version: 0.1.0
  description: MakeItTiny yüksek hızlı kısa link çözümleme, parola doğrulama ve önizleme servisi.
servers:
  - url: http://localhost/r
    description: Router (Nginx Reverse Proxy)
  - url: http://localhost:8081
    description: Router (Doğrudan Port - Geliştirme)
tags:
  - name: Router
paths:
  /health:
    get:
      operationId: health
      tags: [Router]
      summary: Sağlık kontrolü
      responses:
        '200':
          description: Servis ayakta
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /{link}:
    get:
      operationId: redirect
      tags: [Router]
      summary: Kısaltılmış linki hedef adrese yönlendir
      description: >
        Şifresiz linklerde 302 Found ile doğrudan hedef adrese yönlendirir.
        Şifreli linklerde kullanıcıyı şifre çözme ekranına yönlendirir veya 403 döner.
        Tıklama istatistiklerinin kaçırılmaması için 301 kullanılmaz; yanıtta Cache-Control no-store, no-cache bulunur.
      parameters:
        - name: link
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Hedef adrese yönlendirildi
          headers:
            Location:
              schema:
                type: string
                example: https://magaza.example.com/kampanyalar/yaz-indirimi
            Cache-Control:
              schema:
                type: string
                example: no-store, no-cache
        '404':
          description: Kısa link bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /{link}/unlock:
    post:
      operationId: unlock
      tags: [Router]
      summary: Şifreli linkin kilidini aç ve hedef adresi döndür / yönlendir
      parameters:
        - name: link
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockLinkRequest'
      responses:
        '200':
          description: Parola doğrulandı, hedef adres döndürüldü
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlockLinkResponse'
        '302':
          description: Parola doğrulandı, hedef adrese yönlendirildi
          headers:
            Location:
              schema:
                type: string
        '400':
          description: Geçersiz istek verisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Hatalı parola
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Kısa link bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /{link}/preview:
    get:
      operationId: preview
      tags: [Router]
      summary: Kısa linkin nereye götürdüğünü önizle
      parameters:
        - name: link
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Link önizleme bilgisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkPreview'
        '404':
          description: Kısa link bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: link_not_found
        message:
          type: string
          example: Aradığınız kısa link bulunamadı.

    UnlockLinkRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          example: gizli123

    UnlockLinkResponse:
      type: object
      required:
        - target
      properties:
        target:
          type: string
          format: uri
          example: https://magaza.example.com/kampanyalar/yaz-indirimi

    LinkPreview:
      type: object
      required:
        - alias
        - target
        - locked
        - waitEnabled
        - waitSeconds
      properties:
        alias:
          type: string
          example: kampanya-yaz
        target:
          type: string
          description: Link şifreliyse güvenlik için boş döner.
          example: https://magaza.example.com/kampanyalar/yaz-indirimi
        locked:
          type: boolean
          example: false
        waitEnabled:
          type: boolean
          example: false
        waitSeconds:
          type: integer
          format: int32
          example: 0
